<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta + Lap-time Row</title>
<!-- Montserrat vendoreras i tokens.css (@font-face + src/shared/fonts/). Google
     Fonts-lanken som stod har ar borta med flit: en rigg utan nat ritade annars
     i fallback-font och hela designen brots. -->
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
/* Overlay-specifik geometri (palett kommer från tokens.css) */
:root{
  --disc:280px; --bar-h:86px; --overlap:46px;
  --ui-scale:1;                   /* användarens skala; sätts av kontrollpanelen */
  /* Normalisering till standardhöjden (tokens.css --overlay-h). Overlayns
     onormaliserade höjd är 280 px, så 200/280 = 0.7143 ger standarden vid skala 1.
     Utan detta var delta-baren 1,68x högre än inputs-trace vid samma skala. */
  --fit:0.7143;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* skalbart, positionerbart rot-element — window:t är tajt runt detta */
/* Opaciteten från kontrollpanelen ligger i --ui-opacity, inte som inline style:
   annars kör den över opacity:0 och overlayn blir synlig innan första render. */
#ui{position:absolute;top:34px;left:30px;transform:scale(calc(var(--ui-scale) * var(--fit)));transform-origin:top left;
  opacity:0;transition:opacity .3s ease;will-change:transform,opacity;}
#ui.ready{opacity:var(--ui-opacity,1);}
.delta-row{display:flex;align-items:center;}

/* ---- CIRKEL ---- */
.gauge{position:relative;z-index:3;flex:0 0 auto;width:var(--disc);height:var(--disc);border-radius:50%;
  background:
    conic-gradient(from 0deg at 50% 50%, rgba(0,0,0,0.42) 0deg, rgba(255,255,255,0.12) 360deg),
    radial-gradient(circle at 50% 44%,transparent 56%,rgba(0,0,0,0.60) 100%),
    linear-gradient(to bottom, var(--disc-top) 0%, rgb(36,40,37) 42%, rgb(29,33,30) 72%, var(--disc-bot) 100%);
  /* De tva forsta inset-lagren ar diskens EGET material (fasning + vinjett) och ska
     inte folja med skuggfargen. De tre yttre ar sjalva slagskuggan och tar darfor
     --shadow/--shadow-mid/--shadow-soft, sa col-shadow i registry.json faktiskt
     gor nagot. Innan detta var de hardkodade och reglaget var helt verkningslost. */
  box-shadow:inset 0 0 0 3px rgba(0,0,0,0.5),inset 0 0 24px 7px rgba(0,0,0,0.4),
    0 1px 0 rgba(255,255,255,0.07),0 3px 8px var(--shadow-mid),0 12px 26px var(--shadow),
    0 24px 48px var(--shadow-soft);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  display:grid;grid-template-rows:34.5% 31% 34.5%;}
.band{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:linear-gradient(to bottom, transparent 34.5%, var(--band) 34.5%, var(--band) 65.5%, transparent 65.5%);
  -webkit-mask:radial-gradient(circle 116px at 50% 50%, #000 111px, transparent 116px);
          mask:radial-gradient(circle 116px at 50% 50%, #000 111px, transparent 116px);}
.gauge svg.ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.track{fill:none;stroke:var(--track);stroke-width:13;}
.arc{fill:none;stroke-width:13;stroke-linecap:butt;}
.knob{fill:#eef2ef;stroke:#04070a;stroke-width:1.3;}
.endtick{stroke:rgba(255,255,255,0.18);stroke-width:2.5;stroke-linecap:round;}
.g-label{align-self:end;justify-self:center;padding-bottom:7px;font-size:11.5px;font-weight:600;
  letter-spacing:3px;color:var(--dim);text-transform:uppercase;}
.g-value{align-self:center;justify-self:center;font-size:52px;font-weight:600;line-height:1;
  letter-spacing:-0.5px;color:var(--green);display:flex;}
.g-mark{align-self:start;justify-self:center;padding-top:8px;width:26px;height:26px;opacity:.5;}
.g-label,.g-value,.g-mark{position:relative;z-index:3;}
.g-mark path,.g-mark line{fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ---- BAR ---- */
.bar{position:relative;z-index:2;margin-left:calc(var(--overlap)*-1);height:var(--bar-h);
  display:flex;align-items:stretch;background:var(--bar);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 16px 34px var(--shadow-mid);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);padding-left:calc(var(--overlap) + 6px);}
.col{position:relative;flex:1 0 auto;min-width:198px;padding:0 28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.col + .col::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:1px;height:52px;background:var(--divider);}
.time{font-size:40px;font-weight:600;line-height:1;letter-spacing:0.5px;color:var(--ink);display:flex;}
.lab{font-size:12.5px;font-weight:600;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;
  display:flex;align-items:center;gap:7px;white-space:nowrap;}
.lab svg{width:14px;height:14px;}.lab svg path{fill:currentColor;}
.col.pred .time{color:var(--green);} .col.pred .lab{color:var(--green);}
.col.pred[data-slow] .time{color:var(--red);} .col.pred[data-slow] .lab{color:var(--red);}
.col.best::before,.col.best::after{content:"";position:absolute;left:10px;right:10px;height:3px;background:var(--amber);}
.col.best::before{top:0;} .col.best::after{bottom:0;}
.ch{display:inline-block;text-align:center;}
.ch.d{width:0.60em;} .ch.s{width:0.30em;} .ch.m{width:0.62em;}
.faint{color:var(--faint)!important;}

/* edit-läge */
.edit-mode #ui{outline:2px dashed var(--amber);outline-offset:10px;border-radius:8px;cursor:move;}
.edit-badge{position:fixed;top:10px;left:10px;display:none;gap:8px;padding:7px 12px;border-radius:8px;
  background:var(--bar);color:var(--amber);font:700 12px/1 var(--font);letter-spacing:1.5px;text-transform:uppercase;z-index:99;}
.edit-mode .edit-badge{display:flex;}
@media (prefers-reduced-motion:reduce){.arc{transition:none;}}
</style>
</head>
<body>
  <!-- Ingen tangentkombination i texten: den går att byta i panelen sedan 0.5.1, och
       en hårdkodad sträng här hade börjat ljuga i samma sekund. -->
  <div class="edit-badge">● Edit mode</div>
  <div id="ui">
    <div class="delta-row">
      <div class="gauge">
        <div class="band"></div>
        <svg class="ring" viewBox="0 0 280 280">
          <circle class="track" cx="140" cy="140" r="120"></circle>
          <path class="arc" id="arc" d=""></path>
          <line class="endtick" x1="140" y1="256" x2="140" y2="266"></line>
          <circle class="knob" id="knob" r="5"></circle>
        </svg>
        <div class="g-label">Delta</div>
        <div class="g-value" id="deltaVal"></div>
        <svg class="g-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4 L20 18.5 H4 Z"></path><line x1="8.2" y1="14" x2="15.8" y2="14"></line>
        </svg>
      </div>
      <div class="bar">
        <div class="col best"><div class="time" id="tBest"></div><div class="lab">P.Session Best</div></div>
        <div class="col"><div class="time" id="tRef"></div>
          <div class="lab">
            <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
            <span id="driver">—</span>
          </div>
        </div>
        <div class="col pred" id="cellPred"><div class="time" id="tPred"></div><div class="lab">Predicted</div></div>
      </div>
    </div>
  </div>

<script type="module">
import { WsBus, wireShell, fontsReady, startLoop } from '../../shared/bus.js';

/* ---- format ---- */
/* Platshallarna har SAMMA cellbredder som ett riktigt varde (se SPEC nedan):
   annars krymper delta-siffran till en tredjedel av bredden sa fort vardet
   saknas ett enda frame, vilket syns som ett hopp. */
const DASH_D = '\u2013\u2013.\u2013\u2013';   // ––.––  (delta saknas)
const DASH_L = '\u2013\u2013:\u2013\u2013.\u2013\u2013\u2013'; // ––:––.––– (varvtid saknas)
/* Tecknet kommer från det latchade läget (se signAhead), inte från s självt —
   annars flimrar '+'/'-' fram och tillbaka när delta ligger och vaggar kring noll. */
function fmtDelta(s,ahead){return (ahead?'-':'+')+Math.abs(s).toFixed(2);}
function fmtLap(ms){ms=Math.max(0,Math.round(ms));const m=(ms/60000)|0,se=((ms%60000)/1000)|0,mm=ms%1000;
  return `${String(m).padStart(2,'0')}:${String(se).padStart(2,'0')}.${String(mm).padStart(3,'0')}`;}

/* fasta teckenceller (byggs en gång; vi rör bara textContent) */
/* Platshållarna får explicit cell-spec så de mäter EXAKT som ett riktigt värde
   ("+0.12" resp. "02:18.120"); annars hoppar bredden när ett värde saknas. */
const SPEC={
  [DASH_D]:['m','d','s','d','d'],
  [DASH_L]:['d','d','s','d','d','s','d','d','d'],
};
function specFor(str){return SPEC[str] ||
  [...str].map(ch => ch>='0'&&ch<='9'?'d':(ch==='-'||ch==='+')?'m':'s');}
function buildCells(el,str,cls){el.innerHTML='';return [...str].map((ch,i)=>{const s=document.createElement('span');
  s.className='ch '+cls[i];s.textContent=ch;el.appendChild(s);return s;});}
function setCells(el,cache,str){
  const cls=specFor(str);
  if(cache.n!==str.length){cache.nodes=buildCells(el,str,cls);cache.n=str.length;cache.cls=cls;return;}
  for(let i=0;i<str.length;i++){const nd=cache.nodes[i];
    if(cache.cls[i]!==cls[i]){nd.className='ch '+cls[i];cache.cls[i]=cls[i];}
    if(nd.textContent!==str[i])nd.textContent=str[i];}
}

const $=id=>document.getElementById(id);
const el={arc:$('arc'),knob:$('knob'),deltaVal:$('deltaVal'),tBest:$('tBest'),tRef:$('tRef'),
          tPred:$('tPred'),cellPred:$('cellPred'),driver:$('driver')};
(()=>{const a=-90*Math.PI/180;el.knob.setAttribute('cx',140+120*Math.cos(a));el.knob.setAttribute('cy',140+120*Math.sin(a));})();
const cD={n:-1},cB={n:-1},cR={n:-1},cP={n:-1};

/* gauge-geometri: 0=topp, medurs positiv, full=180° (botten) = 1.0 s */
const R=120,MAXDEG=180;
function polar(a){const r=(a-90)*Math.PI/180;return [140+R*Math.cos(r),140+R*Math.sin(r)];}
function arcPath(a1){const[sx,sy]=polar(0),[ex,ey]=polar(a1),large=Math.abs(a1)>180?1:0,sw=a1>=0?1:0;
  return `M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${R} ${R} 0 ${large} ${sw} ${ex.toFixed(2)} ${ey.toFixed(2)}`;}
/* Ingen tomsträng vid små värden: det slog ut bågen HELT i ett frame varje gång
   delta passerade noll (|delta| < 3.3 ms räckte) — det var blinket. En nollång
   båge ritar ändå ingenting eftersom stroke-linecap är butt. */
function valueArc(delta){let s=-delta*MAXDEG;s=Math.max(-MAXDEG,Math.min(MAXDEG,s));return arcPath(s);}

/* ---- state, matad av bussen ---- */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* HOLD_MS: motorn skickar enstaka null-ramar (delta.py:s spikskydd vid mållinjen,
   ACC:s sentinelvärden mellan varv). Utan latch växlar hela overlayn till
   platshållare för ett par frames och tillbaka = flicker. Vi håller senaste
   giltiga värde så länge, sedan faller vi tillbaka på platshållaren. */
const HOLD_MS=700;
/* DEADBAND: under detta behåller vi föregående tecken, så färg och '+'/'-' inte
   vänder fram och tillbaka när delta ligger och vaggar kring noll. */
const DEADBAND=0.02;
const state={target:0,shown:0,bestMs:null,refMs:null,driver:'',
             deltaAt:-Infinity,bestAt:-Infinity,refAt:-Infinity};
let signAhead=null;                      // latchat tecken (true = snabbare/grönt)

/* Vilken referens deltat räknas mot. Registrets `delta-source` styr den och är det
   ENDA reglaget som gör det: 'best' (sessionens bästa varv), 'last' (förra varvet),
   'motec' (den laddade .ld-filen) eller 'off'.
   Motorn skickar alla källor som gäller i ramens `refs` (se frame.py) och väljer
   inte åt oss — valet hör till overlayn, så två overlays kan visa olika referens
   samtidigt. Saknas nyckeln finns ingen sådan referens just nu (ingen fil, inget
   inspelat varv, ut-varv, mållinjens spikskydd) och då visas platshållaren, precis
   som när deltat är null. */
const SRC_DEFAULT='best';
let src=SRC_DEFAULT;

const bus=new WsBus();
bus.subscribe(f=>{
  const now=performance.now();
  const e=(src!=='off'&&f.refs&&typeof f.refs==='object')?f.refs[src]:null;
  if(e&&typeof e.delta==='number'){
    // Första värdet snappas in — annars lerpar vi från 0 och tecknet hinner
    // visas fel i ett par frames innan det landar.
    if(state.deltaAt===-Infinity){state.shown=e.delta;signAhead=e.delta<0;}
    state.target=e.delta;state.deltaAt=now;}
  if(typeof f.sessionBestMs==='number'){state.bestMs=f.sessionBestMs;state.bestAt=now;}
  // Referensvarvets totaltid — grunden för predicted-kolumnen. Kommer ur den VALDA
  // källan, så "förra varvet" predikterar mot förra varvets tid och inte mot bästa.
  if(e&&typeof e.totalMs==='number'){state.refMs=e.totalMs;state.refAt=now;}
  if(f.driverName && f.driverName!==state.driver){state.driver=f.driverName;el.driver.textContent=f.driverName;}
});

/* render — skriv till DOM bara vid ändring, i 30 Hz-tak */
let lastArc='',lastAhead=null,lastD='',lastB='',lastP='',lastFaintD=null,lastFaintB=null,lastFaintP=null;
function aheadOf(d){                     // hysteres kring noll
  if(d<-DEADBAND) return true;
  if(d> DEADBAND) return false;
  return signAhead===null ? d<0 : signAhead;
}
function render(now=performance.now()){
  // Latch: värden räknas som giltiga HOLD_MS efter senaste ram som hade dem.
  const hasDelta = (now-state.deltaAt) < HOLD_MS;
  const bestMs   = (now-state.bestAt)  < HOLD_MS ? state.bestMs : null;
  const refMs    = (now-state.refAt)   < HOLD_MS ? state.refMs  : null;

  // best/ref-tid
  const b = bestMs!=null ? fmtLap(bestMs) : DASH_L;
  if(b!==lastB){setCells(el.tBest,cB,b);setCells(el.tRef,cR,b);lastB=b;}
  if((bestMs==null)!==lastFaintB){lastFaintB=(bestMs==null);
    el.tBest.classList.toggle('faint',lastFaintB);el.tRef.classList.toggle('faint',lastFaintB);}

  const pbase = refMs!=null ? refMs : bestMs;

  if(!hasDelta){
    if(lastArc!==''){el.arc.setAttribute('d','');lastArc='';}
    if(lastD!==DASH_D){setCells(el.deltaVal,cD,DASH_D);lastD=DASH_D;}
    if(lastFaintD!==true){lastFaintD=true;el.deltaVal.classList.add('faint');}
    const p = pbase!=null ? fmtLap(pbase) : DASH_L;
    if(lastP!==p){setCells(el.tPred,cP,p);lastP=p;}
    if(lastFaintP!==true){lastFaintP=true;el.tPred.classList.add('faint');}
    return;
  }
  if(lastFaintD!==false){lastFaintD=false;el.deltaVal.classList.remove('faint');}
  if(lastFaintP!==false){lastFaintP=false;el.tPred.classList.remove('faint');}
  const d=state.shown,ahead=aheadOf(d); signAhead=ahead;
  const path=valueArc(d); if(path!==lastArc){el.arc.setAttribute('d',path);lastArc=path;}
  if(ahead!==lastAhead){
    /* var() och inte hardkodad hex: literalerna som stod har kopplade tyst bort
       col-green/col-red for bade bagen och delta-siffran — resten av overlayn bytte
       farg men de tva syntes aldrig. Inline style med var() loses upp mot
       :root-variabeln som bus.js satter. */
    el.arc.style.stroke=ahead?'var(--green)':'var(--red)';el.deltaVal.style.color=el.arc.style.stroke;
    el.cellPred.toggleAttribute('data-slow',!ahead);lastAhead=ahead;}
  const ds=fmtDelta(d,ahead); if(ds!==lastD){setCells(el.deltaVal,cD,ds);lastD=ds;}
  const ps = pbase!=null ? fmtLap(pbase+d*1000) : DASH_L;
  if(ps!==lastP){setCells(el.tPred,cP,ps);lastP=ps;}
}

/* Ett steg i renderloopen. Takten och deadline-mönstret ligger i bus.js:startLoop
   (§8.5); här stannar bara det som är overlayns eget. dt-taket är 0,05 s: deltan
   ska glida in mjukt även efter en paus, inte hoppa till målvärdet. */
function frame(dt,now){
  const tau=REDUCED?0.0001:0.20;
  state.shown+=(state.target-state.shown)*(1-Math.exp(-dt/tau));
  render(now);
}

/* skal: skala/opacitet från kontrollpanelen, edit-läge/drag, alternativ */
wireShell(({scale,opacity})=>{
  if(typeof scale==='number') document.documentElement.style.setProperty('--ui-scale',String(scale));
  // Via variabel, inte inline opacity: annars kör den över opacity:0 och overlayn
  // blir synlig innan första render (tomma sifferceller) och sedan poppar texten in.
  if(typeof opacity==='number') document.documentElement.style.setProperty('--ui-opacity',String(opacity));
},(opt,val)=>{
  if(opt==='predicted') el.cellPred.style.display = val ? '' : 'none';
  if(opt==='delta-source'){
    const next=(typeof val==='string'&&val)?val:SRC_DEFAULT;
    if(next!==src){
      src=next;
      /* Släpp latchen. Utan detta hölls FÖRRA källans delta i HOLD_MS efter bytet,
         alltså en siffra som redan bytt betydelse — och med 'off' hade overlayn
         stått kvar med ett värde i 0,7 s efter att man stängt av den. */
      state.deltaAt=-Infinity; state.refAt=-Infinity; signAhead=null;
    }
  }
});

// Rita FÖRST, visa sedan. fontsReady väntar in Montserrat men aldrig i evighet —
// fonten hämtas över nätet och riggen kan vara offline.
fontsReady().then(()=>{
  render();
  document.getElementById('ui').classList.add('ready');
  startLoop(frame,{dtCap:0.05});
});
</script>
</body>
</html>
