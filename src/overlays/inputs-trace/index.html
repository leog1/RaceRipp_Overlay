<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inputs Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
/* Overlay-specifik geometri (palett från tokens.css) */
:root{
  /* Panelhöjd = skalenhet. Värdet är standardhöjden ur tokens.css (--overlay-h)
     så alla overlays är lika stora vid skala 1,0; kontrollpanelen multiplicerar
     med användarens skala. */
  --H:200px;
  --r:calc(var(--H)*0.0625); --pad:calc(var(--H)*0.060);
  --bar-w:calc(var(--H)*0.190); --bar-h:calc(var(--H)*0.735);
  --bar-gap:calc(var(--H)*0.055); --bar-r:calc(var(--H)*0.022);
  /* Pedalsiffran ska rymmas INOM stapelbredden (--bar-w = 0.190·H = 38 px vid
     H=200). Montserrat tabular är ~0,70 em per siffra, så "100" blir 2,1× fontens
     storlek: vid 0.115·H (23 px) är siffran 48 px mot stapelns 38 px och de tre
     talen flöt ihop till ett block vid full gas. Felet syns BARA vid tresiffriga
     värden, vilket är varför det slank igenom.
     0.086·H = 17,2 px → 36 px, alltså innanför stapeln med marginal. Uppmätt mot
     riktig rendering, inte räknat: 0.092 låg exakt kant i kant och såg fortfarande
     trångt ut. */
  --col-gap:calc(var(--H)*0.075); --val-fs:calc(var(--H)*0.086);
}
*{box-sizing:border-box;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);}
#ui{position:absolute;top:14px;left:14px;will-change:opacity;}

.overlay{height:var(--H);width:calc(var(--H)*3.72);padding:var(--pad);
  display:flex;align-items:flex-end;gap:var(--col-gap);
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:var(--depth),var(--sheen);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  opacity:0;transition:opacity .35s ease;}
.overlay.ready{opacity:1;}
.graph{position:relative;flex:1 1 auto;align-self:stretch;min-width:0;
  background:var(--plot);border:1px solid var(--edge);border-radius:calc(var(--r)*0.5);overflow:hidden;}
.graph .grid{position:absolute;inset:0;width:100%;height:100%;}
.graph .grid line{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 4;}
.graph canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.bars{display:flex;align-items:flex-end;gap:var(--bar-gap);}
.bar-col{display:flex;flex-direction:column;align-items:center;width:var(--bar-w);}
.bar-value{width:100%;text-align:center;white-space:nowrap;overflow:visible;
  font-size:var(--val-fs);font-weight:600;line-height:1;color:var(--dim);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;margin-bottom:calc(var(--H)*0.028);}
.bar-value.active{color:var(--ink);}
.bar-slot{position:relative;width:var(--bar-w);height:var(--bar-h);background:var(--track);
  border:1px solid var(--slot-edge);border-radius:var(--bar-r);overflow:hidden;}
.bar-fill{position:absolute;left:0;right:0;bottom:0;top:0;transform-origin:bottom center;transform:scaleY(0);}
.bar-fill.clutch{background:var(--clutch);} .bar-fill.brake{background:var(--red);} .bar-fill.throttle{background:var(--green);}
/* Referensmärke på stapeln: tunn linje vid referensvarvets värde just här på banan.
   Vit och halvgenomskinlig med flit — den ska läsas som "inte du" utan att lägga
   beslag på grönt/rött, som redan betyder kanal.
   Positioneras med transform och inte med bottom i procent: värdet ändras 30 ggr/s
   under körning, och bottom hade tvingat omlayout varje gång. §3 säger animera bara
   transform/opacity. --m är andelen 0..1 och sätts från JS. */
.bar-mark{position:absolute;left:-1px;right:-1px;height:2px;bottom:0;
  background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(0,0,0,.55);
  pointer-events:none;display:none;will-change:transform;
  transform:translateY(calc(var(--bar-h) * -1 * var(--m, 0)));}

.edit-mode #ui{outline:2px dashed var(--amber);outline-offset:8px;border-radius:8px;cursor:move;}
.edit-badge{position:fixed;top:8px;left:8px;display:none;gap:8px;padding:6px 10px;border-radius:8px;
  background:var(--bar);color:var(--amber);font:700 11px/1 var(--font);letter-spacing:1.4px;text-transform:uppercase;z-index:99;}
.edit-mode .edit-badge{display:flex;}
</style>
</head>
<body>
  <div class="edit-badge">● Edit</div>
  <div id="ui">
    <div class="overlay" id="overlay" aria-label="Inputs trace overlay">
      <div class="graph">
        <svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="25" x2="100" y2="25" vector-effect="non-scaling-stroke"/>
          <line x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"/>
          <line x1="0" y1="75" x2="100" y2="75" vector-effect="non-scaling-stroke"/>
          <line x1="20" y1="0" x2="20" y2="100" vector-effect="non-scaling-stroke"/>
          <line x1="40" y1="0" x2="40" y2="100" vector-effect="non-scaling-stroke"/>
          <line x1="60" y1="0" x2="60" y2="100" vector-effect="non-scaling-stroke"/>
          <line x1="80" y1="0" x2="80" y2="100" vector-effect="non-scaling-stroke"/>
        </svg>
        <canvas id="trace"></canvas>
      </div>
      <div class="bars">
        <div class="bar-col" id="col-clutch"><div class="bar-value" id="v-clutch">0</div><div class="bar-slot"><div class="bar-fill clutch" id="f-clutch"></div></div></div>
        <div class="bar-col"><div class="bar-value" id="v-brake">0</div><div class="bar-slot"><div class="bar-fill brake" id="f-brake"></div><div class="bar-mark" id="m-brake"></div></div></div>
        <div class="bar-col"><div class="bar-value" id="v-throttle">0</div><div class="bar-slot"><div class="bar-fill throttle" id="f-throttle"></div><div class="bar-mark" id="m-throttle"></div></div></div>
      </div>
    </div>
  </div>

<script type="module">
import { WsBus, wireShell, fontsReady, startLoop } from '../../shared/bus.js';

const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Clock = { now(){ return performance.now(); } };   // scroll-tid (lokal)
const TAU = 0.05;                                       // s, utjämning av pedalstaplar
/* Standardhöjden ur tokens.css. Läses därifrån så det finns EN källa — hårdkodas
   den här glider overlays isär i storlek igen. */
const OVERLAY_H = Number(getComputedStyle(document.documentElement)
                    .getPropertyValue('--overlay-h').trim()) || 200;
/* Spökspårets nedtoning. 0.38 är valt så referensen går att följa men aldrig
   konkurrerar med din egen insats — den ska läsas som djup, inte som en andra linje. */
const GHOST_ALPHA = 0.38;
/* Samma latch-princip som HOLD_MS i delta-baren (§8.5): motorn skickar null enstaka
   ramar vid mållinjen, och utan hållning fick spökspåret hål som syns som blink. */
const REF_HOLD_MS = 700;

/* Ramen kan sakna fält (delvis ram, ovänligt data) — utan detta blir disp NaN och
   NaN är klistrigt: stapeln fastnar på scaleY(NaN) och etiketten visar "NaN". */
const num01 = v => (typeof v === 'number' && isFinite(v)) ? (v < 0 ? 0 : v > 1 ? 1 : v) : 0;

class InputsTrace{
  constructor(bus, root){
    this.channels=['throttle','brake','clutch','abs','tc'];
    this.root=root; this.canvas=root.querySelector('#trace'); this.ctx=this.canvas.getContext('2d');
    this.graph=root.querySelector('.graph');
    this.el={ throttle:[root.querySelector('#f-throttle'),root.querySelector('#v-throttle')],
              brake:[root.querySelector('#f-brake'),root.querySelector('#v-brake')],
              clutch:[root.querySelector('#f-clutch'),root.querySelector('#v-clutch')] };
    this.marks={ throttle:root.querySelector('#m-throttle'), brake:root.querySelector('#m-brake') };
    this.samples=[]; this.latest={throttle:0,brake:0,clutch:0,abs:false,tc:false,rThrottle:null,rBrake:null};
    this.disp={throttle:0,brake:0,clutch:0};
    this.ghost=true; this._ref=null;
    this.setWindow(4.5);
    this.col=this._readColors(); this._resize();
    new ResizeObserver(()=>this._resize()).observe(this.graph);
    bus.subscribe(f=>this._onFrame(f));
    // Takt + deadline ligger i bus.js:startLoop (§8.5). dt-taket är 0,25 s.
    startLoop(dt=>this._render(dt));
  }
  /* Synligt tidsfönster i sekunder (alternativet "window" i registry.json).
     Bara 500 ms marginal utöver det synliga fönstret: allt äldre strokeades ändå
     varje frame bara för att klippas bort. */
  setWindow(sec){
    const ms=Math.max(1000,Number(sec)*1000);
    if(!isFinite(ms))return;
    this.VISIBLE_MS=ms; this.HISTORY_MS=ms+500;
  }
  _readColors(){const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
    return {green:g('--green'),red:g('--red'),tc:g('--tc'),abs:g('--abs')};}
  _resize(){const dpr=window.devicePixelRatio||1;
    this.cw=Math.round(this.graph.clientWidth);this.ch=Math.round(this.graph.clientHeight);
    this.canvas.width=Math.round(this.cw*dpr);this.canvas.height=Math.round(this.ch*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.traceW=Math.max(2,Math.round(this.ch*0.018));
    this.plotTop=Math.round(this.ch*0.06);this.plotBot=this.ch-Math.round(this.traceW/2);}
  _onFrame(f){
    const now=Clock.now();
    /* Referensvarvets pedaler sparas i SAMMA sampel som dina egna. Motorn skickar
       värdet för nuvarande position, så spöket hamnar automatiskt i linje med det
       aktiva spåret — trots att x-axeln här är TID och referensen är indexerad på
       POSITION. Overlayn behöver alltså ingen egen positionsbokföring.
       Latch enligt §8.5: motorn skickar null enstaka ramar (mållinjens spikskydd),
       och utan hållning hade spökspåret fått hål som syns som blink i en linje. */
    const rt=typeof f.refThrottle==='number'?num01(f.refThrottle):null;
    const rb=typeof f.refBrake==='number'?num01(f.refBrake):null;
    if(rt!==null||rb!==null){ this._ref={t:now,throttle:rt,brake:rb}; }
    const held=(this._ref&&(now-this._ref.t)<REF_HOLD_MS)?this._ref:null;
    const s={t:now,throttle:num01(f.throttle),brake:num01(f.brake),
             clutch:num01(f.clutch),abs:!!f.abs,tc:!!f.tc,
             rThrottle:held?held.throttle:null, rBrake:held?held.brake:null};
    this.latest=s;
    this.samples.push(s);
    const cutoff=s.t-this.HISTORY_MS-200;
    while(this.samples.length&&this.samples[0].t<cutoff)this.samples.shift();}
  /* Spökspår: referensvarvet i samma kulör som ditt eget, men tunnare och nedtonat,
     ritat UNDER. Samma grepp som MoTeC i2 och RaceLab använder för jämförelsevarv —
     det inför inget nytt färgspråk, så "grönt = gas" håller. ABS/TC färgar med flit
     bara ditt eget spår; referensens vore bara brus. */
  _drawGhost(now,key,color,pxPerMs){
    if(!this.ghost)return;
    const s=this.samples,n=s.length; if(n<2)return; const ctx=this.ctx;
    const X=smp=>Math.round(this.cw-(now-smp.t)*pxPerMs);
    ctx.save();
    ctx.globalAlpha=GHOST_ALPHA;
    ctx.strokeStyle=color;
    ctx.lineWidth=Math.max(1,Math.round(this.traceW*0.6));
    ctx.lineJoin='miter';ctx.miterLimit=12;ctx.lineCap='butt';
    let started=false,any=false;
    ctx.beginPath();
    for(let k=0;k<n;k++){
      const v=s[k][key];
      if(typeof v!=='number'||!isFinite(v)){started=false;continue;}  // hål = ingen referens där
      const x=X(s[k]),y=this._yOf(v);
      if(started){ctx.lineTo(x,y);any=true;} else {ctx.moveTo(x,y);started=true;}
    }
    // Stroke bara om vi faktiskt la till geometri. Utan detta anropades stroke() på
    // en tom path 60 ggr/s så fort ingen referens fanns — gratis arbete, och det
    // gjorde dessutom ritanropen omöjliga att mäta i testet.
    if(any)ctx.stroke();
    ctx.restore();}
  _yOf(v){return this.plotBot-v*(this.plotBot-this.plotTop);}
  _drawLine(now,key,flag,base,alt,pxPerMs){
    const s=this.samples,n=s.length; if(n<2)return; const ctx=this.ctx;
    const X=smp=>Math.round(this.cw-(now-smp.t)*pxPerMs);
    ctx.lineWidth=this.traceW;ctx.lineJoin='miter';ctx.miterLimit=12;ctx.lineCap='butt';
    let k=0;
    while(k<n-1){const segAlt=s[k][flag]||s[k+1][flag];ctx.strokeStyle=segAlt?alt:base;
      ctx.beginPath();ctx.moveTo(X(s[k]),this._yOf(s[k][key]));ctx.lineTo(X(s[k+1]),this._yOf(s[k+1][key]));
      let m=k+1;while(m<n-1&&((s[m][flag]||s[m+1][flag])===segAlt)){ctx.lineTo(X(s[m+1]),this._yOf(s[m+1][key]));m++;}
      ctx.stroke();k=m;}}
  _render(dt){
    const ctx=this.ctx,now=Clock.now(),col=this.col;
    ctx.clearRect(0,0,this.cw,this.ch);ctx.save();
    ctx.beginPath();ctx.rect(0,0,this.cw,this.ch);ctx.clip();
    const pxPerMs=this.cw/this.VISIBLE_MS;
    // Ritordningen är hela poängen: spöket underst, sedan broms, sedan gas överst.
    // Din egen insats får aldrig hamna bakom referensens.
    this._drawGhost(now,'rBrake',col.red,pxPerMs);
    this._drawGhost(now,'rThrottle',col.green,pxPerMs);
    this._drawLine(now,'brake','abs',col.red,col.abs,pxPerMs);
    this._drawLine(now,'throttle','tc',col.green,col.tc,pxPerMs);
    ctx.restore();
    const a=prefersReduced?1:(1-Math.exp(-dt/TAU));   // tidsbaserad, oberoende av Hz
    for(const key of ['throttle','brake','clutch']){
      this.disp[key]+=(this.latest[key]-this.disp[key])*a;const v=this.disp[key];
      const [fill,label]=this.el[key];fill.style.transform=`scaleY(${v.toFixed(4)})`;
      const pct=Math.round(v*100);
      if(label.textContent!==String(pct))label.textContent=pct;
      label.classList.toggle('active',pct>=2);}
    this._markBars();
  }
  /* Referensmärke på pedalstaplarna: en tunn linje tvärs stapeln vid referensens
     värde just här på banan. Ligger märket ovanför din fyllnad gav referensen mer.
     Skrivs bara vid ändring — _render kör 30 ggr/s (§8.5). */
  _markBars(){
    for(const [key,refKey] of [['throttle','rThrottle'],['brake','rBrake']]){
      const mark=this.marks[key]; if(!mark)continue;
      const v=this.ghost?this.latest[refKey]:null;
      const show=(typeof v==='number');
      if(show!==mark._shown){mark._shown=show;mark.style.display=show?'':'none';}
      if(!show)continue;
      const m=v.toFixed(4);
      if(mark._at!==m){mark._at=m;mark.style.setProperty('--m',m);}
    }
  }
}

const bus=new WsBus();
const trace=new InputsTrace(bus, document.getElementById('overlay'));

wireShell(({scale,opacity})=>{
  if(typeof scale==='number') document.documentElement.style.setProperty('--H',(OVERLAY_H*scale)+'px');
  if(typeof opacity==='number') document.getElementById('ui').style.opacity=String(opacity);
},(opt,val)=>{
  if(opt==='clutch'){ const c=document.getElementById('col-clutch'); if(c) c.style.display = val ? '' : 'none'; }
  if(opt==='window') trace.setWindow(val);
  if(opt==='ghost') trace.ghost = !!val;
  /* Canvas-färgerna läses EN gång vid start och cachas (de används 30 ggr/s).
     Ändras en färg måste cachen fyllas på — annars ritar traces vidare i den gamla
     färgen medan resten av panelen redan bytt. bus.js har satt CSS-variabeln innan
     detta anrop, så omläsningen ger det nya värdet. */
  if(typeof opt==='string' && opt.startsWith('col-')) trace.col = trace._readColors();
});
// Väntar in fonten men aldrig i evighet (riggen kan vara offline).
fontsReady().then(()=>document.getElementById('overlay').classList.add('ready'));
</script>
</body>
</html>
