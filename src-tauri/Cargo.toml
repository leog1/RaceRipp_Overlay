[package]
name = "acc-overlay"
version = "0.3.0"
description = "ACC Overlay Pack"
edition = "2021"

[lib]
name = "acc_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job Object för motor-sidecaren: PyInstaller --onefile lägger en bootloader mellan
# oss och den riktiga motorn, och TerminateProcess dödar inte barnbarn. Se
# confine_engine() i lib.rs. Redan i beroendeträdet via tauri/wry — ingen ny bygg-tid.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",          # CreateJobObjectW tar SECURITY_ATTRIBUTES
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
