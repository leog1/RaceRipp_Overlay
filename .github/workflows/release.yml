name: release

# Bygger Windows-installer + genererar latest.json (auto-update) när du taggar
# en version, t.ex.:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  # Manuell korning finns for att kunna prova TESTSTEGEN utan att kapa en tagg.
  # Utan den var enda vagen att se om CI klarar ett nytt test att slappa en version,
  # och ett rott releasebygge ar ett dyrt satt att fa reda pa att en runner saknar
  # nagot. Publiceringssteget hoppas over utan tagg (se `if` dar nere).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # De TVA testerna som kraver en riktig webblasare kor i ett EGET jobb, inte i
  # release-jobbet: panelens layouttest och overlay-window-fit (ryms overlayn med
  # sin skugga i sitt fonster?). Skalet: bada startar Chrome, och en
  # releasepipeline ska inte kunna falla pa att en runner saknar en webblasare —
  # bygget och publiceringen behover ingen. Jobbet gatar alltsa ingenting, men det
  # gar rott om ett test faller, sa felet ar fortfarande synligt och maste rattas.
  # Det ar skillnaden mot att hoppa over testet.
  panel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Kor panel- och fonstergeometritesterna (Chrome)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Vilken Chrome runnern faktiskt har, innan testet startar den: faller
          # steget ar det forsta man vill veta.
          Get-ChildItem "C:\Program Files\Google\Chrome\Application\chrome.exe",
                        "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" `
                        -ErrorAction SilentlyContinue |
            Select-Object FullName, VersionInfo
          pnpm test:panel

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      # Node 22 och inte 20: tests/panel-layout.mjs driver Chrome over CDP och
      # behover global WebSocket, som finns forst fran Node 21. Pa 20 foll steget
      # med "WebSocket is not defined" — och det var forsta gangen testet kordes i
      # CI, alltsa i en release. Sank inte tillbaka.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      # Testerna kors FORE bygget: ett gront CI-bygge har redan en gang betytt en
      # trasig utgava (0.2.4, se CLAUDE.md 8.6c), och da var verify_sidecar det enda
      # som tittade pa vad som faktiskt hamnade i binaren. Overlay-testerna ar rena
      # Node-skript utan beroenden och tar sekunder.
      #
      # ETT undantag: tests/panel-layout.mjs startar Chrome headless och mater
      # layout-flikens geometri. windows-latest har Chrome forinstallerad. Faller
      # steget med "Hittar ingen Chrome" ar det runner-avbilden som andrats — satt
      # CHROME till ratt sokvag har, ta inte bort testet.
      - name: Kor overlay-tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg Python-motorn (sidecar)
        shell: pwsh
        run: |
          # UTAN dessa två rader svalde steget fel mitt i skriptet: i pwsh stoppar
          # inte ett misslyckat native-kommando körningen, och bara SISTA kommandots
          # exitkod avgör om steget lyckades. Så byggde 0.2.4 en sidecar utan
          # ldparser medan CI rapporterade success.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          python -m pip install --upgrade pip pyinstaller
          pip install -r engine/requirements.txt

          # ldparser är EN fil, inte ett pip-paket: repot har varken setup.py eller
          # pyproject.toml, så `pip install git+...` kan inte fungera. Hämta filen dit
          # PyInstaller hittar den via --paths engine. (GPL-3.0, committas ej i repot.)
          Invoke-WebRequest -UseBasicParsing `
            -Uri https://raw.githubusercontent.com/gotzl/ldparser/master/ldparser.py `
            -OutFile engine/ldparser.py

          pyinstaller --onefile --name acc-engine --paths engine --collect-submodules acc_engine --hidden-import ldparser engine/run_engine.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # Tauri kräver target-triple-suffix på externalBin:
          Copy-Item dist/acc-engine.exe src-tauri/binaries/acc-engine-x86_64-pc-windows-msvc.exe -Force

      # MASTE ligga efter sidecar-steget. `tauri-build` validerar `externalBin` vid
      # KOMPILERING, sa varje cargo-kommando i src-tauri (aven `cargo test`) faller med
      # "resource path binaries\acc-engine-...exe doesn't exist" innan en enda rad kod
      # kompilerats. Lokalt marks det inte — dar ligger binaren redan kvar sedan
      # forra bygget. Det var precis sa v0.4.2 forsta forsoket foll.
      #
      # Testerna sjalva ar skalets rena logik: sokvagsskyddet i get_background (ett id
      # fran IPC:n far aldrig peka utanfor bakgrundskatalogen), base64 och att
      # standardbakgrunden faktiskt finns i repot.
      - name: Kor skalets enhetstester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Verifiera att sidecarn har allt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python engine/verify_sidecar.py src-tauri/binaries/acc-engine-x86_64-pc-windows-msvc.exe

      # Kors efter sidecar-steget for att pip-beroendena ska finnas. verify_sidecar
      # kontrollerar att modulerna LIGGER i binaren; dessa kontrollerar att motorn
      # faktiskt gar att kora och att ramschemat ar intakt.
      #
      # engine_smoke binder 8777/8078 pa runnern och tar ~1 minut (den startar
      # medvetet en andra instans for att testa portkonflikten). Blir den nagonsin
      # flakig ar den ratt sak att plocka bort forst - de andra tva ar deterministiska.
      #
      # motec_reference kors INTE har: den kraver en riktig .ld som CI inte har och
      # skulle bara hoppa over sig sjalv.
      - name: Kor motortester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/acc_source.py
          python tests/delta_source.py
          python tests/lap_recorder.py
          python tests/broadcast_protocol.py
          python tests/engine_smoke.py

      # Bara vid TAGG. En manuell korning (workflow_dispatch) finns for att prova
      # testerna, och den ska inte kunna publicera en release under namnet "main".
      - name: Bygg & publicera (Tauri)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Genereras med `pnpm tauri signer generate`; läggs som repo-secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SimMatrix ${{ github.ref_name }}"
          releaseBody: "Se ändringar nedan. Auto-update via latest.json."
          releaseDraft: false
          prerelease: false
          # Genererar latest.json som updater-endpointen pekar på:
          includeUpdaterJson: true
